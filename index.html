<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シフト自動割り振りアプリ</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f4;--card:#fff;--tx:#1d2a27;--mut:#667370;--line:#d8dfdd;--pri:#0f766e;--prt:#fff;--bad:#b42318;
--wait:#e4e7e6;--off:#fbe0dc;--help:#d99a1e;
--c0:#d6ecf7;--c1:#dcefd9;--c2:#f6e3cf;--c3:#e6dcf3;--c4:#f5d9e3;--c5:#e3ecc9}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px 8px}
h1{font-size:18px;margin:0;flex:1 1 auto}
header label{color:var(--mut);display:flex;align-items:center;gap:6px}
.app{display:flex;align-items:flex-start}
nav{display:flex;flex-direction:column;gap:2px;width:140px;flex:0 0 auto;padding:8px 0;border-right:1px solid var(--line);position:sticky;top:0;align-self:stretch}
.tab{background:none;border:0;border-left:4px solid transparent;padding:10px 14px;color:var(--mut);font:inherit;cursor:pointer;text-align:left}
.tab.on{color:var(--tx);border-left-color:var(--pri);background:var(--card);font-weight:700}
main{padding:14px 16px 40px;flex:1 1 auto;min-width:0}
@media (max-width:640px){nav{width:88px}.tab{padding:10px 8px;font-size:13px}main{padding:10px 8px 40px}}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:56px}
input[type=number]{width:64px}
input[type=checkbox]{min-width:0;width:18px;height:18px}
button.b{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.p{background:var(--pri);color:var(--prt);border:0;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.mut{color:var(--mut)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%}
table{border-collapse:collapse}
th,td{border:1px solid var(--line);padding:3px 6px;text-align:center;white-space:nowrap}
th{background:var(--bg);font-weight:600}
.g td:first-child,.g th:first-child{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;font-weight:600}
.g th:first-child{background:var(--bg)}
.g td.cell{cursor:pointer;min-width:38px;user-select:none}
.sat{color:#2563eb}.sun{color:#d92d20}
.o{background:var(--c1)}.x{background:var(--off)}.w{background:var(--wait);color:var(--mut)}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.hp{box-shadow:inset 0 -3px 0 var(--help);font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.stat b{display:block;font-size:20px}
.stat.bad b{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0;font-size:12px}
.legend span{padding:1px 8px;border-radius:4px;border:1px solid var(--line)}
.err td:nth-child(5){text-align:left}
.ok{padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.lv{color:var(--bad);font-weight:700}

:root{--wkS:#dce8f6;--wkU:#f7dde2}

.gm{font-size:12px}.gm th,.gm td{padding:2px 4px}
.gm td.cell{min-width:42px;height:24px;cursor:pointer}
.gm th.ws,.gm td.ws{background:var(--wkS)}.gm th.wu,.gm td.wu{background:var(--wkU)}
.gm td.sh{background:var(--off)}.gm td.mn{background:var(--wait)}
.gm tr.last>*{border-bottom:2px solid #9aa8a4}
.gm .tot{font-weight:600}.gm .sumr th,.gm .sumr td{background:var(--bg)}
.gm th.cn{min-width:56px}
.legend .lw{background:var(--wkS)}.legend .lu{background:var(--wkU)}.legend .ls{background:var(--off)}.legend .lm{background:var(--wait)}
.rule{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.rule:last-child{border-bottom:0}.rule input{margin-top:4px}.rule .tag{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
h2{font-size:15px;margin:22px 0 8px}
</style>
</head>
<body>
<header>
  <h1>シフト自動割り振りアプリ</h1>
  <label>対象月 <input type="month" id="ym"></label>
</header>
<div class="app"><nav id="nav"></nav><main id="v"></main></div>
<script>
const DW=['月','火','水','木','金','土','日'];
const TABS=[['s','シフト表'],['h','希望入力'],['t','先生'],['c','医院'],['r','ルール'],['k','ルールチェック']];
const q=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,tab='s';

const RULES=[
['consec','連続出勤の上限を守る','先生タブの「連勤上限」を超えて連続で出勤させない','配置・チェック'],
['week','週の上限日数を守る','先生タブの「週上限」を超えて出勤させない','配置・チェック'],
['main','メイン所属院を優先して配置する','まず所属院の必要人数を埋め、余った先生を他院へ回す','配置'],
['helpOk','他院ヘルプ不可の先生は他院に配置しない','先生タブの「他院ヘルプ可」にチェックがない先生が対象','配置・チェック'],
['helpPri','応援先は優先順位の順に決める','先生タブの「応援先 第1〜第3」の順に、人手が足りない院へ配置','配置'],
['helpOnly','応援先は登録した院だけにする','応援先を1つでも登録した先生を、登録外の院へ行かせない','配置・チェック'],
['balance','稼働日数が少ない先生から先に配置する','特定の先生に出勤が偏らないようにする','配置'],
['need','各医院の必要人数を満たす','人数が足りない日・医院を表示','チェック'],
['minDays','医院の最低稼働日数を満たす','月内に1名以上が配置された日数が、医院タブの最低稼働日数以上か','チェック']];
function defRules(){const o={};RULES.forEach(r=>o[r[0]]=true);return o}
function seed(){
  const cl=[['大宮',[3,3,3,3,3,2,0]],['柏',[2,2,2,2,2,1,0]],['新宿',[2,2,2,2,2,2,0]],['渋谷',[2,2,2,2,2,1,0]]].map((c,i)=>({id:'c'+i,name:c[0],req:c[1],min:[20,18,20,18][i]}));
  const tn=[['山田 太郎',0],['佐藤 花子',0],['鈴木 一郎',0,3],['高橋 美咲',1],['田中 健',1],['伊藤 さくら',1,3],['渡辺 大輔',2],['中村 優子',2],['小林 誠',3],['加藤 彩',3,4]];
  const th=tn.map((t,i)=>{const hp=![2,5,7].includes(i);return{id:'t'+i,name:t[0],main:'c'+t[1],week:t[2]||5,consec:t[2]||6,help:hp,pri:hp?['c'+((t[1]+1)%4),'c'+((t[1]+2)%4),'']:['','','']}});
  const av={};let p=0;
  for(let d=1;d<=30;d++){
    const dow=(new Date(2026,10,d).getDay()+6)%7,key='2026-11-'+String(d).padStart(2,'0');
    if(dow<5){
      th.forEach((t,i)=>{
        if(i===2&&![0,2,4].includes(dow))return;
        if(i===5&&![1,3].includes(dow))return;
        av[t.id+'|'+key]=(i%2===0&&i!==2&&[(i*3)%10,(i*3+4)%10].includes(p))?'x':'o';
      });p++;
    }else if(dow===5){
      (d===7?[0,3,6,8]:d===14?[1,4,7]:[]).forEach(i=>av[th[i].id+'|'+key]='o');
    }
  }
  const late={};[['t0',[4,11,18]],['t6',[5,12,19]],['t8',[6,13]]].forEach(x=>x[1].forEach(d=>late[x[0]+'|2026-11-'+String(d).padStart(2,'0')]=1));
  return{ym:'2026-11',clinics:cl,teachers:th,avail:av,late,rules:defRules(),result:null,n:100};
}
function norm(){S.rules=Object.assign(defRules(),S.rules||{});S.late=S.late||{};S.teachers.forEach(t=>{if(!t.pri)t.pri=['','','']});S.clinics.forEach(c=>{if(c.min==null)c.min=0})}
function load(){try{return JSON.parse(localStorage.getItem('shiftapp1'))}catch(e){return null}}
function save(){try{localStorage.setItem('shiftapp1',JSON.stringify(S))}catch(e){}}

function days(){
  const [y,m]=S.ym.split('-').map(Number),n=new Date(y,m,0).getDate();
  return[...Array(n)].map((_,i)=>{const d=i+1;return{d,dow:(new Date(y,m-1,d).getDay()+6)%7,key:S.ym+'-'+String(d).padStart(2,'0')}});
}
function cname(id){const c=S.clinics.find(c=>c.id===id);return c?c.name:'?'}
function cidx(id){return Math.max(0,S.clinics.findIndex(c=>c.id===id))}

// ---- 自動割り振り：①メイン所属院 → ②不足している他院（ヘルプ）→ ③待機 ----
function assign(){
  const D=days(),st={},res={},R=S.rules;
  S.teachers.forEach(t=>st[t.id]={m:0,w:{},set:new Set()});
  const wk=i=>Math.floor((i+D[0].dow)/7);
  D.forEach((day,i)=>{
    const req={},got={},pool=[];
    S.clinics.forEach(c=>{req[c.id]=c.req[day.dow]||0;got[c.id]=0});
    S.teachers.forEach(t=>{
      const a=S.avail[t.id+'|'+day.key],k=day.key+'|'+t.id;
      if(!a)return;
      if(a==='x'){res[k]={k:'休'};return}
      const s=st[t.id];let streak=0;
      for(let j=i-1;j>=0&&s.set.has(D[j].key);j--)streak++;
      if((R.week&&t.week&&(s.w[wk(i)]||0)>=t.week)||(R.consec&&t.consec&&streak>=t.consec)){res[k]={k:'待機'};return}
      pool.push(t);
    });
    if(R.balance)pool.sort((a,b)=>st[a.id].m-st[b.id].m);
    const put=(t,c,k)=>{res[day.key+'|'+t.id]={c:c.id,k};got[c.id]++;const s=st[t.id];s.m++;s.w[wk(i)]=(s.w[wk(i)]||0)+1;s.set.add(day.key)};
    let rest=[];
    if(R.main)pool.forEach(t=>{const c=S.clinics.find(c=>c.id===t.main);(c&&got[c.id]<req[c.id])?put(t,c,'通常'):rest.push(t)});
    else rest=pool;
    rest.forEach(t=>{
      let best=null,bs=0;
      S.clinics.forEach(c=>{
        const sh=req[c.id]-got[c.id];if(sh<=0)return;
        const own=c.id===t.main,pi=t.pri.indexOf(c.id);
        if(!own){
          if(R.helpOk&&!t.help)return;
          if(R.helpOnly&&t.pri.some(Boolean)&&pi<0)return;
        }
        const sc=sh+(!own&&R.helpPri&&pi>=0?(4-pi)*1000:0);
        if(sc>bs){bs=sc;best=c}
      });
      best?put(t,best,best.id===t.main?'通常':'ヘルプ'):res[day.key+'|'+t.id]={k:'待機'};
    });
  });
  S.result={ym:S.ym,res};save();
}
function counts(){
  const c={};
  if(S.result)for(const k in S.result.res){const r=S.result.res[k];if(r.c){const kk=k.split('|')[0]+'|'+r.c;c[kk]=(c[kk]||0)+1}}
  return c;
}
// ---- ルールチェック：連続出勤・人数不足 ----
function check(){
  const D=days(),R=S.result.res,cs=counts(),out=[],mm=+S.ym.slice(5),RL=S.rules;
  const wk=i=>Math.floor((i+D[0].dow)/7),ds=d=>mm+'/'+d.d+'（'+DW[d.dow]+'）';
  S.teachers.forEach(t=>{
    let run=0,st=0;const w={};
    D.forEach((d,i)=>{
      const r=R[d.key+'|'+t.id],has=r&&r.c;
      if(has){
        w[wk(i)]=(w[wk(i)]||0)+1;if(!run)st=d.d;run++;
        if(r.c!==t.main){
          if(RL.helpOk&&!t.help)out.push({t:'他院ヘルプ',d:ds(d),c:cname(r.c),w:t.name,m:'他院ヘルプ不可の先生が所属外の院に配置されています'});
          else if(RL.helpOnly&&t.pri.some(Boolean)&&!t.pri.includes(r.c))out.push({t:'応援先',d:ds(d),c:cname(r.c),w:t.name,m:'応援先に登録していない院に配置されています'});
        }
      }
      if(run&&(!has||i===D.length-1)){
        if(RL.consec&&t.consec&&run>t.consec)out.push({t:'連続出勤',d:mm+'/'+st+'〜'+mm+'/'+(has?d.d:d.d-1),c:'-',w:t.name,m:run+'日連続で出勤（上限'+t.consec+'日）'});
        run=0;
      }
    });
    if(RL.week&&t.week)for(const k in w)if(w[k]>t.week)out.push({t:'週上限',d:'第'+(+k+1)+'週',c:'-',w:t.name,m:w[k]+'日出勤（上限'+t.week+'日）'});
  });
  if(RL.need)D.forEach(d=>S.clinics.forEach(c=>{
    const r=c.req[d.dow]||0,g=cs[d.key+'|'+c.id]||0;
    if(g<r)out.push({t:'人数不足',d:ds(d),c:c.name,w:'-',m:'必要'+r+'名に対し'+g+'名（'+(r-g)+'名不足）'});
  }));
  if(RL.minDays)S.clinics.forEach(c=>{
    let n=0;D.forEach(d=>{if((cs[d.key+'|'+c.id]||0)>0)n++});
    if(c.min&&n<c.min)out.push({t:'最低稼働日数',d:S.ym,c:c.name,w:'-',m:'稼働'+n+'日（最低'+c.min+'日）'});
  });
  return out;
}

// ---- 画面 ----
function head(D,first){
  return'<tr><th>'+first+'</th>'+D.map(d=>'<th class="'+(d.dow===5?'sat':d.dow===6?'sun':'')+'">'+d.d+'<br><small>'+DW[d.dow]+'</small></th>').join('')+'</tr>';
}
function sn(t){return t.name.split(/[ 　]/)[0]}
function vS(){
  const D=days(),yy=S.ym.slice(0,4),mm=+S.ym.slice(5),wc=d=>d.dow===5?' ws':d.dow===6?' wu':'';
  let h='<div class="bar"><button class="p" data-a="run">自動配置する</button><span class="mut">セルを押すと担当を切り替えられます（候補を順に表示し、空欄まで一周）。</span></div>';
  if(!S.result||S.result.ym!==S.ym)return h+'<div class="ok">この月はまだ配置していません。「希望入力」を確認して「自動配置する」を押してください。</div>';
  const R=S.result.res,L={},wd={};
  S.teachers.forEach(t=>{wd[t.id]=0;D.forEach(d=>{const r=R[d.key+'|'+t.id];if(r&&r.c){(L[d.key+'|'+r.c]=L[d.key+'|'+r.c]||[]).push({t,k:r.k,m:r.m});wd[t.id]++}})});
  for(const k in L)L[k].sort((a,b)=>(a.k==='ヘルプ')-(b.k==='ヘルプ'));
  const tot=Object.values(wd).reduce((a,b)=>a+b,0);
  h+='<p class="mut" style="margin:0 0 6px">'+yy+'/'+mm+'/1 ～ '+yy+'/'+mm+'/'+D.length+'</p>';
  h+='<div class="wrap" style="margin-bottom:12px"><table class="gm"><tr><th>先生</th>'+S.teachers.map(t=>'<th class="cn">'+esc(sn(t))+'</th>').join('')+'<th>合計</th></tr><tr><th>稼働日数</th>'+S.teachers.map(t=>'<td>'+wd[t.id]+'</td>').join('')+'<td class="tot">'+tot+'</td></tr></table></div>';
  h+='<div class="wrap"><table class="gm"><tr><th>医院</th><th>出勤</th>'+D.map(d=>'<th class="'+wc(d).trim()+'">'+String(d.d).padStart(2,'0')+'<br>'+DW[d.dow]+'</th>').join('')+'</tr>';
  h+='<tr class="sumr"><th colspan="2">稼働数</th>'+D.map(d=>'<td>'+S.clinics.reduce((a,c)=>a+(c.req[d.dow]||0),0)+'</td>').join('')+'</tr>';
  h+='<tr class="sumr"><th colspan="2">出勤数</th>'+D.map(d=>'<td>'+S.clinics.reduce((a,c)=>a+(L[d.key+'|'+c.id]||[]).length,0)+'</td>').join('')+'</tr>';
  S.clinics.forEach(c=>{
    let n=1,ct=0;
    D.forEach(d=>{const a=(L[d.key+'|'+c.id]||[]).length;n=Math.max(n,c.req[d.dow]||0,a);ct+=a});
    for(let j=0;j<n;j++){
      h+='<tr'+(j===n-1?' class="last"':'')+'>';
      if(j===0)h+='<th rowspan="'+n+'">'+esc(c.name)+'</th><td rowspan="'+n+'" class="tot">'+ct+'</td>';
      D.forEach(d=>{
        const p=(L[d.key+'|'+c.id]||[])[j];let cl='cell'+wc(d),tx='';
        if(p){tx=(p.k==='ヘルプ'?'★':'')+esc(sn(p.t));if(p.m)cl+=' mn'}else if(j<(c.req[d.dow]||0))cl+=' sh';
        h+='<td class="'+cl+'" data-a="sc" data-k="'+d.key+'|'+c.id+'|'+j+'">'+tx+'</td>';
      });
      h+='</tr>';
    }
  });
  h+='</table></div><div class="legend"><span>★＝他院からのヘルプ</span><span class="ls">不足の枠</span><span class="lm">手で変更したセル</span><span class="lw">土</span><span class="lu">日</span></div>';
  return h;
}
function vH(){
  const D=days();
  let h='<div class="bar"><button class="b" data-a="wk">平日を全員「○」にする</button><button class="b" data-a="clr">この月の希望を全消去</button><span class="mut">セルを押すたびに ・ → ○（出勤可）→ 休（希望休）→ ・ と切り替わります。</span></div>';
  h+='<div class="wrap"><table class="g">'+head(D,'先生');
  S.teachers.forEach(t=>{
    h+='<tr><td>'+esc(t.name)+'</td>';
    D.forEach(d=>{
      const a=S.avail[t.id+'|'+d.key];
      h+='<td class="cell '+(a||'')+'" data-a="hc" data-k="'+t.id+'|'+d.key+'">'+(a==='o'?'○':a==='x'?'休':'·')+'</td>';
    });
    h+='</tr>';
  });
  return h+'</table></div>';
}
function vT(){
  const D=days(),opt=(sel,ex)=>'<option value="">なし</option>'+S.clinics.filter(c=>c.id!==ex).map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  let h='<div class="bar"><button class="b" data-a="at">＋先生を追加</button><span class="mut">週上限・連勤上限が 0 の場合は上限なしです。応援先は優先順位の高い順（第1が最優先）。</span></div><div class="wrap"><table><tr><th>名前</th><th>メイン所属院</th><th>週上限（日）</th><th>連勤上限（日）</th><th>他院ヘルプ可</th><th>応援先 第1</th><th>応援先 第2</th><th>応援先 第3</th><th></th></tr>';
  S.teachers.forEach((t,i)=>{
    h+='<tr><td><input data-t="'+i+'" data-f="name" value="'+esc(t.name)+'"></td><td><select data-t="'+i+'" data-f="main">'+S.clinics.map(c=>'<option value="'+c.id+'"'+(c.id===t.main?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></td>'
    +'<td><input type="number" min="0" data-t="'+i+'" data-f="week" value="'+t.week+'"></td><td><input type="number" min="0" data-t="'+i+'" data-f="consec" value="'+t.consec+'"></td>'
    +'<td><input type="checkbox" data-t="'+i+'" data-f="help"'+(t.help?' checked':'')+'></td>'
    +[0,1,2].map(j=>'<td><select data-t="'+i+'" data-p="'+j+'">'+opt(t.pri[j],t.main)+'</select></td>').join('')
    +'<td><button class="b" data-a="dt" data-i="'+i+'">削除</button></td></tr>';
  });
  h+='</table></div><h2>遅番できる日（'+S.ym.replace('-','年')+'月）</h2><div class="bar"><span class="mut">遅番が可能な日を押すと「遅」が付きます（もう一度押すと解除）。</span></div><div class="wrap"><table class="g">'+head(D,'先生');
  S.teachers.forEach(t=>{
    h+='<tr><td>'+esc(t.name)+'</td>'+D.map(d=>{const on=S.late[t.id+'|'+d.key];return'<td class="cell'+(on?' o':'')+'" data-a="lc" data-k="'+t.id+'|'+d.key+'">'+(on?'遅':'·')+'</td>'}).join('')+'</tr>';
  });
  return h+'</table></div><div class="bar" style="margin-top:12px"><button class="b" data-a="reset">サンプルに戻す</button></div>';
}
function vC(){
  let h='<div class="bar"><button class="b" data-a="ac">＋医院を追加</button><span class="mut">曜日ごとの必要人数と、月の最低稼働日数（1名以上が配置される日数）を入力します。</span></div><div class="wrap"><table><tr><th>医院名</th>'+DW.map(d=>'<th>'+d+'</th>').join('')+'<th>最低稼働日数（月）</th><th></th></tr>';
  S.clinics.forEach((c,i)=>{
    h+='<tr><td><input data-c="'+i+'" data-f="name" value="'+esc(c.name)+'"></td>'+c.req.map((r,j)=>'<td><input type="number" min="0" data-c="'+i+'" data-r="'+j+'" value="'+r+'"></td>').join('')+'<td><input type="number" min="0" data-c="'+i+'" data-f="min" value="'+c.min+'"></td><td><button class="b" data-a="dc" data-i="'+i+'">削除</button></td></tr>';
  });
  return h+'</table></div>';
}
function vR(){
  return'<p class="mut" style="margin-top:0">チェックを入れたルールが反映されます。「配置」のルールは自動配置のやり直しで、「チェック」のルールは「ルールチェック」タブで効きます。</p><div class="wrap">'
   +RULES.map(r=>'<label class="rule"><input type="checkbox" data-rl="'+r[0]+'"'+(S.rules[r[0]]?' checked':'')+'><span><b>'+r[1]+'</b><br><span class="mut">'+r[2]+'</span></span><span class="tag">'+r[3]+'</span></label>').join('')+'</div>';
}
function vK(){
  if(!S.result||S.result.ym!==S.ym)return'<div class="ok">先に「シフト表」で自動配置を実行してください。</div>';
  const e=check(),on=RULES.filter(r=>S.rules[r[0]]).length;
  if(!e.length)return'<div class="ok">✓ ルール違反はありません（有効なルール '+on+'件）。</div>';
  const by={};e.forEach(x=>by[x.t]=(by[x.t]||0)+1);
  return'<div class="stats"><div class="stat bad">違反<b>'+e.length+'</b></div>'+Object.keys(by).map(k=>'<div class="stat">'+k+'<b>'+by[k]+'</b></div>').join('')+'</div>'
   +'<div class="wrap"><table class="err"><tr><th>種別</th><th>日付</th><th>医院名</th><th>先生名</th><th>内容</th></tr>'
   +e.map(x=>'<tr><td class="lv">'+x.t+'</td><td>'+x.d+'</td><td>'+esc(x.c)+'</td><td>'+esc(x.w)+'</td><td>'+x.m+'</td></tr>').join('')+'</table></div>';
}
function render(){
  q('#ym').value=S.ym;
  q('#nav').innerHTML=TABS.map(t=>'<button class="tab'+(t[0]===tab?' on':'')+'" data-a="tab" data-k="'+t[0]+'">'+t[1]+'</button>').join('');
  q('#v').innerHTML={s:vS,h:vH,t:vT,c:vC,r:vR,k:vK}[tab]();
}
function rr(){const w=q('.wrap'),l=w?w.scrollLeft:0;render();const n=q('.wrap');if(n)n.scrollLeft=l}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,k=b.dataset.k,i=+b.dataset.i;
  if(a==='tab'){tab=k;render();return}
  if(a==='run'){assign();rr();return}
  if(a==='hc'){
    const c=S.avail[k];
    if(!c)S.avail[k]='o';else if(c==='o')S.avail[k]='x';else delete S.avail[k];
    S.result=null;save();rr();return;
  }
  if(a==='sc'&&S.result){
    const [dk,cid,j]=k.split('|'),R=S.result.res,T=S.teachers;
    const cur0=T.filter(t=>{const r=R[dk+'|'+t.id];return r&&r.c===cid}).map(t=>({t,k:R[dk+'|'+t.id].k})).sort((x,y)=>(x.k==='ヘルプ')-(y.k==='ヘルプ'));
    const cur=cur0[+j]?cur0[+j].t:null;
    const cand=T.filter(t=>{const r=R[dk+'|'+t.id];return S.avail[t.id+'|'+dk]==='o'&&!(r&&r.c)});
    const opts=[null].concat(T.filter(t=>t===cur||cand.includes(t))),nx=opts[(opts.indexOf(cur)+1)%opts.length];
    if(cur)R[dk+'|'+cur.id]={k:'待機'};
    if(nx)R[dk+'|'+nx.id]={c:cid,k:nx.main===cid?'通常':'ヘルプ',m:1};
    save();rr();return;
  }
  if(a==='lc'){if(S.late[k])delete S.late[k];else S.late[k]=1;save();rr();return}
  if(a==='wk'){
    days().forEach(d=>{if(d.dow<5)S.teachers.forEach(t=>{const kk=t.id+'|'+d.key;if(!S.avail[kk])S.avail[kk]='o'})});
    S.result=null;save();rr();return;
  }
  if(a==='clr'){days().forEach(d=>S.teachers.forEach(t=>delete S.avail[t.id+'|'+d.key]));S.result=null;save();rr();return}
  if(a==='at'){S.teachers.push({id:'t'+(S.n++),name:'新しい先生',main:S.clinics[0]?S.clinics[0].id:'',week:5,consec:6,help:true});S.result=null;save();rr();return}
  if(a==='dt'){S.teachers.splice(i,1);S.result=null;save();rr();return}
  if(a==='ac'){S.clinics.push({id:'c'+(S.n++),name:'新しい医院',req:[2,2,2,2,2,1,0]});S.result=null;save();rr();return}
  if(a==='dc'){S.clinics.splice(i,1);S.result=null;save();rr();return}
  if(a==='reset'){
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent='もう一度押すとサンプルに戻ります';return}
    S=seed();assign();rr();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='ym'){if(el.value){S.ym=el.value;save();render()}return}
  if(el.dataset.rl){S.rules[el.dataset.rl]=el.checked;save();return}
  const f=el.dataset.f;
  if(el.dataset.t!==undefined){
    const t=S.teachers[+el.dataset.t];
    if(el.dataset.p!==undefined)t.pri[+el.dataset.p]=el.value;
    else t[f]=el.type==='checkbox'?el.checked:el.type==='number'?(Number(el.value)||0):el.value;
    S.result=null;save();
  }else if(el.dataset.c!==undefined){
    const c=S.clinics[+el.dataset.c];
    if(el.dataset.r!==undefined)c.req[+el.dataset.r]=Number(el.value)||0;else c[f]=f==='min'?(Number(el.value)||0):el.value;
    S.result=null;save();
  }
});

S=load()||seed();norm();
if(!S.result)assign();
render();
</script>
</body>
</html>
